<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="outer-clip">
      <circle cx="128" cy="128" r="120"/>
    </clipPath>
  </defs>

  <!-- Colorful pinwheel segments -->
  <path d="M128,128 L128,8 A120,120 0 0,1 232,68 Z" fill="#f05a28"/>
  <path d="M128,128 L232,68 A120,120 0 0,1 232,188 Z" fill="#f5a623"/>
  <path d="M128,128 L232,188 A120,120 0 0,1 128,248 Z" fill="#7db544"/>
  <path d="M128,128 L128,248 A120,120 0 0,1 24,188 Z" fill="#2eaadc"/>
  <path d="M128,128 L24,188 A120,120 0 0,1 24,68 Z" fill="#5b5ea6"/>
  <path d="M128,128 L24,68 A120,120 0 0,1 128,8 Z" fill="#d63b6e"/>

  <!-- Divider lines -->
  <g stroke="white" stroke-width="1.5" opacity="0.25" clip-path="url(#outer-clip)">
    <line x1="128" y1="128" x2="128" y2="8"/>
    <line x1="128" y1="128" x2="232" y2="68"/>
    <line x1="128" y1="128" x2="232" y2="188"/>
    <line x1="128" y1="128" x2="128" y2="248"/>
    <line x1="128" y1="128" x2="24" y2="188"/>
    <line x1="128" y1="128" x2="24" y2="68"/>
  </g>

  <!-- White camera silhouette -->
  <!-- Body -->
  <rect x="72" y="102" width="112" height="76" rx="12" ry="12" fill="white"/>
  <!-- Viewfinder bump -->
  <rect x="96" y="88" width="40" height="22" rx="7" ry="7" fill="white"/>
  <!-- Shutter button bump -->
  <rect x="148" y="90" width="20" height="16" rx="5" ry="5" fill="white"/>
  <!-- Lens hole (punched out with circle) -->
  <circle cx="128" cy="142" r="24" fill="none" stroke="white" stroke-width="0"/>
  <!-- Lens as colored circle cutout -->
  <circle cx="128" cy="142" r="26" fill="white"/>
  <circle cx="128" cy="142" r="18" fill="#2eaadc"/>
  <circle cx="128" cy="142" r="10" fill="white" opacity="0.25"/>
  <!-- Flash dot -->
  <circle cx="96" cy="114" r="5" fill="#2eaadc"/>

  <!-- Outer border -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="white" stroke-width="3"/>
</svg>
